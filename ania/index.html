<!doctype html>
<!--
  El idioma real lo decide `ui/state.ts` al arrancar (lo elegido antes, o el del navegador) y
  corrige este atributo. Aqui va "en" porque es lo que hay que decir mientras no se sepa: es el
  idioma de la descripcion de abajo, que es lo que leen los buscadores y lo que se comparte.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Battle pass creator for Pokémon Battle Revolution." />

    <title>ANIA+</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS ignora el manifiesto para el icono de la pantalla de inicio: necesita esta etiqueta. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#048e9f" />
    <meta name="apple-mobile-web-app-title" content="ANIA+" />

    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
